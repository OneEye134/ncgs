{% extends "base.html" %}

{% block title %}No Cap, Good Story - Login/Signup{% endblock %}

{% block content %}
    <section class="auth-block" id="login-block">
        <h2>Login</h2>
        <form method="POST" action="/login">
            <input type="text" name="identifier" placeholder="Username or Email" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <span class="toggle-link" onclick="showSignup()">Don't have an account? Sign up</span>
    </section>

    <section class="auth-block" id="signup-block" style="display:none;">
        <h2>Sign Up</h2>
        <form method="POST" action="/signup">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="email" name="email" placeholder="Email" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Sign Up</button>
        </form>
        <span class="toggle-link" onclick="showLogin()">Already have an account? Login</span>
    </section>
{% endblock %}

{% block extra_script %}
<script>
    function showSignup() {
        document.getElementById('login-block').style.display = 'none';
        document.getElementById('signup-block').style.display = 'block';
    }

    function showLogin() {
        document.getElementById('signup-block').style.display = 'none';
        document.getElementById('login-block').style.display = 'block';
    }
</script>
{% endblock %}
