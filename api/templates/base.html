<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='img/logos.svg') }}" type="image/png">
    <meta name="author" content="Mumud">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}No Cap, Good Story{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_style %}{% endblock %}
    <script>
        // Apply saved theme before first paint to avoid a flash of the wrong theme.
        (function () {
            function getCookie(name) {
                const match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
                return match ? decodeURIComponent(match[1]) : null;
            }
            const saved = getCookie('theme');
            const theme = saved === 'dark' || saved === 'light'
                ? saved
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="header">
        <a href="/" class="site-title">
            <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="No Cap, Good Story" class="site-logo">
        </a>
        <div class="header-actions">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="icon-sun" aria-hidden="true">☀️</span>
                <span class="icon-moon" aria-hidden="true">🌙</span>
            </button>
            {% if session.get('username') %}
                <span class="account-name">Hi, {{ session['username'] }}</span>
                <button id="write-btn" onclick="redirectTo('/write')">Write a Story</button>
                <button id="write-btn" onclick="redirectTo('/favorites')">Favorites</button>
                <button id="write-btn" onclick="redirectTo('/profile')">Profile</button>
                <button id="auth-btn" onclick="redirectTo('/logout')">Logout</button>
            {% else %}
                <button id="auth-btn" onclick="redirectTo('/auth')">Login</button>
            {% endif %}
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <p class="credit">v2.2.5 Cool update</p>
    </footer>

    <script>
        function redirectTo(link) {
            window.location.href = link;
        }

        // --- Dark mode toggle (persisted via cookie) ---
        (function () {
            const COOKIE_NAME = 'theme';
            const COOKIE_MAX_AGE = 60 * 60 * 24 * 365; // 1 year

            function getCookie(name) {
                const match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
                return match ? decodeURIComponent(match[1]) : null;
            }

            function setCookie(name, value, maxAgeSeconds) {
                const secure = window.location.protocol === 'https:' ? '; Secure' : '';
                document.cookie = name + '=' + encodeURIComponent(value) +
                    '; Max-Age=' + maxAgeSeconds +
                    '; Path=/; SameSite=Lax' + secure;
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const btn = document.getElementById('theme-toggle');
                if (btn) {
                    btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
                }
            }

            function currentTheme() {
                return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            }

            const toggleBtn = document.getElementById('theme-toggle');
            if (toggleBtn) {
                applyTheme(currentTheme());
                toggleBtn.addEventListener('click', function () {
                    const next = currentTheme() === 'dark' ? 'light' : 'dark';
                    applyTheme(next);
                    setCookie(COOKIE_NAME, next, COOKIE_MAX_AGE);
                });
            }

            // Keep in sync if the OS theme changes and the user hasn't chosen one explicitly.
            if (window.matchMedia && !getCookie(COOKIE_NAME)) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                    if (!getCookie(COOKIE_NAME)) {
                        applyTheme(e.matches ? 'dark' : 'light');
                    }
                });
            }
        })();
    </script>
    {% block extra_script %}{% endblock %}
</body>
</html>
