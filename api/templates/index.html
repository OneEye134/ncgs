{% extends "base.html" %}

{% block title %}No Cap, Good Story{% endblock %}

{% block content %}
    <div id="welcome-banner" style="display:none;"></div>

    <section class="stories-section">
        <div class="stories-section-header">
            <h2 id="stories-heading">Latest Stories</h2>
            <div class="stories-controls">
                <div class="sort-toggle" role="tablist" id="sort-toggle">
                    <button type="button" id="sort-recent-btn" class="sort-toggle-btn active" onclick="setSort('recent')">Most Recent</button>
                    <button type="button" id="sort-likes-btn" class="sort-toggle-btn" onclick="setSort('likes')">Most Liked</button>
                </div>
                <form id="search-form" class="story-search-form" role="search">
                    <input type="text" id="search-input" placeholder="Search title, description, or #hashtag" aria-label="Search stories by title, description, or hashtag">
                    <button type="submit">Search</button>
                    <button type="button" id="clear-search-btn" style="display:none;">Clear</button>
                </form>
            </div>
        </div>
        <div id="stories-list" class="stories-grid">
            <p class="stories-status">Loading stories...</p>
        </div>
    </section>
{% endblock %}

{% block extra_script %}
<script src="{{ url_for('static', filename='js/rank.js') }}"></script>
<script>
    // Show a welcome message after signup or login
    const params = new URLSearchParams(window.location.search);
    const banner = document.getElementById('welcome-banner');

    if (params.get('signup') === 'true') {
        banner.textContent = "🎉 Welcome! Your account has been created successfully.";
        banner.style.display = 'block';
    } else if (params.get('login') === 'true') {
        banner.textContent = "👋 Welcome back{% if session.get('username') %}, {{ session['username'] }}{% endif %}!";
        banner.style.display = 'block';
    }

    const listEl = document.getElementById('stories-list');
    const headingEl = document.getElementById('stories-heading');
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const sortToggleEl = document.getElementById('sort-toggle');
    const sortRecentBtn = document.getElementById('sort-recent-btn');
    const sortLikesBtn = document.getElementById('sort-likes-btn');

    let currentSort = 'recent';

    function renderStories(stories, emptyMessage) {
        if (!stories || stories.length === 0) {
            listEl.innerHTML = `<p class="stories-status">${escapeHtml(emptyMessage)}</p>`;
            return;
        }

        listEl.innerHTML = '';
        stories.forEach(story => {
            const writer = story.users || {};
            const authorName = writer.nickname || writer.username || 'Unknown';
            const initial = authorName.trim().charAt(0).toUpperCase() || '?';
            const date = story.created_at
                ? new Date(story.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
                : '';
            const authorHtml = writer.username
                ? `<a href="/profile/${encodeURIComponent(writer.username)}" class="author-link">${escapeHtml(authorName)}</a>`
                : escapeHtml(authorName);
            const likes = story.likes || 0;
            const chapterCount = story.chapter_count || 0;
            const chaptersHtml = chapterCount > 0
                ? `Season ${story.season} &middot; Chapter ${chapterCount}`
                : 'No chapters yet';

            const card = document.createElement('div');
            card.className = 'story-block';
            card.innerHTML = `
                <div class="story-header">
                    <div>
                        <h3>${escapeHtml(story.title)}</h3>
                        <p class="story-meta">By ${authorHtml}${date ? ' &middot; ' + date : ''} &middot; <span class="story-card-likes">&hearts; ${likes}</span></p>
                        <p class="story-meta story-card-chapters">${chaptersHtml}</p>
                    </div>
                </div>
                <p>${escapeHtml(story.description || '')}</p>
                <button class="read-story-btn">Read the Story</button>
            `;

            // Real avatar_url (falling back to an initial) with the
            // rank-appropriate effect applied around it.
            const avatarSlot = writer.avatar_url
                ? buildAvatarFx(writer, { sizeClass: 'avatar-fx-slot--card', imgClass: 'story-avatar-img' })
                : (() => {
                    const slot = document.createElement('div');
                    slot.className = 'avatar-fx-slot avatar-fx-slot--card';
                    const wrap = document.createElement('div');
                    wrap.className = 'avatar-fx-wrap';
                    const fallback = document.createElement('div');
                    fallback.className = 'story-avatar';
                    fallback.textContent = initial;
                    wrap.appendChild(fallback);
                    slot.appendChild(wrap);
                    applyAvatarEffect(wrap, (writer.rank_info && writer.rank_info.rank) || 'Newcomer');
                    return slot;
                })();
            card.querySelector('.story-header').prepend(avatarSlot);

            card.querySelector('.read-story-btn').addEventListener('click', () => {
                redirectTo('/story/' + story.id);
            });
            listEl.appendChild(card);
        });
    }

    // Load the story feed from the API, honoring the current sort mode
    async function loadStories() {
        headingEl.textContent = currentSort === 'likes' ? 'Most Liked Stories' : 'Latest Stories';
        clearSearchBtn.style.display = 'none';
        sortToggleEl.style.display = 'flex';
        listEl.innerHTML = '<p class="stories-status">Loading stories...</p>';
        try {
            const res = await fetch(`/api/getstories?sort=${encodeURIComponent(currentSort)}`);
            if (!res.ok) throw new Error('Failed to fetch stories');
            const stories = await res.json();
            renderStories(stories, 'No stories yet.');
        } catch (err) {
            listEl.innerHTML = '<p class="stories-status">Couldn\'t load stories right now.</p>';
            console.error(err);
        }
    }

    function setSort(sort) {
        if (sort === currentSort) return;
        currentSort = sort;
        sortRecentBtn.classList.toggle('active', sort === 'recent');
        sortLikesBtn.classList.toggle('active', sort === 'likes');
        loadStories();
    }

    // Search always ranks results most-liked-first, so the sort toggle
    // (which only applies to the plain feed) is hidden while searching.
    async function searchStories(query) {
        const isHashtag = query.trim().startsWith('#');
        headingEl.textContent = isHashtag
            ? `Results for "#${query.trim().replace(/^#+/, '')}"`
            : `Results for "${query.trim()}"`;
        clearSearchBtn.style.display = 'inline-block';
        sortToggleEl.style.display = 'none';
        listEl.innerHTML = '<p class="stories-status">Searching...</p>';
        try {
            const res = await fetch(`/api/searchstories?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Search failed');
            renderStories(data, 'No stories found.');
        } catch (err) {
            listEl.innerHTML = `<p class="stories-status">${escapeHtml(err.message)}</p>`;
            console.error(err);
        }
    }

    searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (!query) return;
        searchStories(query);
    });

    clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        loadStories();
    });

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    loadStories();
</script>
{% endblock %}
